name = "credscore"
compatibility_date = "2026-09-26"
send_metrics = false

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

# Configure these in Cloudflare Pages for production builds, or keep these
# values for a repeatable Studio Dev deployment from Wrangler.
[vars]
VITE_CREDSCORE_NETWORK = "studio-dev"
# Set VITE_CREDSCORE_ADDRESS in the Cloudflare project after deploying contracts/credscore.py.
# An older CredScore address does not expose open_task or the dispute bond.
